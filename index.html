<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Tisha! 🎉</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 25px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff4d6d;
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 15px;
    }

    .special-message {
      font-size: 16px;
      color: #ff4d6d;
      font-style: italic;
      margin-bottom: 15px;
    }

    .heart {
      font-size: 50px;
      animation: beat 1s infinite;
      display: inline-block;
      margin-bottom: 10px;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .from {
      margin-top: 20px;
      font-style: italic;
      color: #777;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="heart">❤️</div>
  <h1>Happy Birthday, Tisha (Ruhisar Ammu)! 🎂</h1>
  <p>
    You are my sunshine, my smile, and my everything.  
    May your birthday be filled with love, laughter, and all the happiness you deserve!
  </p>

  <p class="special-message">
    Life is hard, but at least I have you. I love you ❤️
  </p>

  <div class="from">
    Forever yours,<br>
    — Your Boy ❤️
  </div>
</div>

</body>
</html>
